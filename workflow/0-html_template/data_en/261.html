<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Registration Form</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 18px;
        }
        td {
            border: 1px solid black;
            padding: 12px;
            vertical-align: middle;
        }
        /* 清除标题粗体 */
        h2 {
            font-weight: normal;
            margin: 0;
        }
    </style>
</head>
<body>
    <table>
        <!-- 标题（无粗体） -->
        <tr>
            <td colspan="9"><h2>Hospital Registration Form</h2></td>
        </tr>

        <!-- 表头第一行 -->
        <tr>
            <td rowspan="2">serial<br>number</td>
            <td rowspan="2">date</td>
            <td colspan="6">personal information</td>
            <td rowspan="2">department</td>
        </tr>

        <!-- 表头第二行 -->
        <tr>
            <td>Name</td>
            <td>gender</td>
            <td>age</td>
            <td>ID card</td>
            <td>Contact<br>information</td>
            <td>Home<br>address</td>
        </tr>

        <!-- 10行空白行 -->
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    </table>
</body>
</html>
