<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-bottom: 10px;
        }

        td {
            border: 3px solid #000;
            vertical-align: top;
            padding: 8px;
        }
    </style>
</head>

<body>
    <table style="border-collapse: collapse; border: solid rgb(0, 0, 0); width: 100%;" class="fr-table-selection-hover">
        <tbody>
            <tr>
                <td colspan="5" align="center" style="border: solid rgb(0, 0, 0); width: 99.8601%;"><strong>Certificate of Bulk Posting for Registered Mail</strong></td>
            </tr>
            <tr>
                <td colspan="3" style="border: solid rgb(0, 0, 0);">Sender and full address</td>
                <td colspan="2" style="border: solid rgb(0, 0, 0);">Telephone</td>
            </tr>
            <tr>
                <td colspan="3" style="border: solid rgb(0, 0, 0);"><br></td>
                <td colspan="2" style="border: solid rgb(0, 0, 0);"><br></td>
            </tr>
            <tr>
                <td colspan="2" align="center" style="border: solid rgb(0, 0, 0);">Name and address of addressee</td>
                <td rowspan="2" align="center" style="border: solid rgb(0, 0, 0);">Registered Barcode No.</td>
                <td rowspan="2" align="center" style="border: solid rgb(0, 0, 0);">Total Postage<br><small>(including Reg. &amp; AR fee (if applicable))</small></td>
                <td rowspan="2" align="center" style="border: solid rgb(0, 0, 0);">AR Service &quot;✓&quot;</td>
            </tr>
            <tr>
                <td align="center" style="border: solid rgb(0, 0, 0);">Name</td>
                <td align="center" style="border: solid rgb(0, 0, 0);">Full address</td>
            </tr>
            <tr>
                <td style="border: solid rgb(0, 0, 0);">1</td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
            </tr>
            <tr>
                <td style="border: solid rgb(0, 0, 0);">2</td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
            </tr>
            <tr>
                <td style="border: solid rgb(0, 0, 0);">3</td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
            </tr>
            <tr>
                <td style="border: solid rgb(0, 0, 0);">4</td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
                <td style="border: solid rgb(0, 0, 0);"><br></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
