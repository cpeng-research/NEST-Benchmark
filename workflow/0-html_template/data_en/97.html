<table border="0" width="100%" cellpadding="10" cellspacing="0">
    <!-- 标题栏 -->
    <tr bgcolor="#E0E0E0">
        <td colspan="4" align="center" height="30"></td>
    </tr>
    <tr>
        <td colspan="4" align="center">
            <h3>For Mechanic Use Only</h3>
        </td>
    </tr>

    <!-- 接待与指派 -->
    <tr>
        <td width="15%" align="right">Received by:</td>
        <td width="35%" border="1" bgcolor="#F0F0F0" height="30"></td>
        <td width="15%" align="right">Assigned to:</td>
        <td width="35%" border="1" bgcolor="#F0F0F0"></td>
    </tr>

    <!-- 诊断与日期 -->
    <tr>
        <td align="right">Diagnosis:</td>
        <td border="1" bgcolor="#F0F0F0" height="30"></td>
        <td align="right">Date:</td>
        <td border="1" bgcolor="#F0F0F0"></td>
    </tr>

    <!-- 预估与期限 -->
    <tr>
        <td align="right">Estimate:</td>
        <td border="1" bgcolor="#F0F0F0" height="30"></td>
        <td align="right">Deadline:</td>
        <td border="1" bgcolor="#F0F0F0"></td>
    </tr>

    <!-- 订购零件详情 -->
    <tr>
        <td align="right" valign="top">Parts Ordered:</td>
        <td colspan="3" border="1" bgcolor="#F0F0F0" height="100"></td>
    </tr>

    <!-- 工时计算 -->
    <tr>
        <td align="right">Hours</td>
        <td colspan="3">
            <table border="0" width="100%">
                <tr>
                    <td width="30%" border="1" bgcolor="#F0F0F0" height="30"></td>
                    <td width="15%" align="center">x rate</td>
                    <td width="30%" border="1" bgcolor="#F0F0F0"></td>
                    <td width="5%" align="center">=</td>
                    <td width="5%" align="right">$</td>
                    <td width="15%" border="1" bgcolor="#F0F0F0"></td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- 材料计算 -->
    <tr>
        <td align="right">Materials</td>
        <td colspan="3">
            <table border="0" width="100%">
                <tr>
                    <td width="30%" border="1" bgcolor="#F0F0F0" height="30"></td>
                    <td width="15%" align="center">x unit price</td>
                    <td width="30%" border="1" bgcolor="#F0F0F0"></td>
                    <td width="5%" align="center">=</td>
                    <td width="5%" align="right">$</td>
                    <td width="15%" border="1" bgcolor="#F0F0F0"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
