<table border="1" width="100%" style="border-collapse: collapse; font-family: Arial, sans-serif;">
    <!-- 标题 -->
    <tr>
        <td colspan="4" align="center" style="padding: 10px;">
            <h1>Vehicle Work Order</h1>
        </td>
    </tr>

    <!-- 车主基本信息 -->
    <tr>
        <td width="15%" style="padding: 5px;">Owner:</td>
        <td width="45%" bgcolor="#f2f2f2">[Owner]</td>
        <td width="10%" style="padding: 5px;">Date:</td>
        <td width="30%" bgcolor="#f2f2f2">[Date]</td>
    </tr>
    <tr>
        <td style="padding: 5px;">Email:</td>
        <td bgcolor="#f2f2f2">[Email]</td>
        <td style="padding: 5px;">Phone:</td>
        <td bgcolor="#f2f2f2">[Phone]</td>
    </tr>
    <tr>
        <td style="padding: 5px;">Address:</td>
        <td colspan="3" bgcolor="#f2f2f2">[Address]</td>
    </tr>

    <!-- 车辆详细信息 -->
    <tr>
        <td style="padding: 5px;">Car Make:</td>
        <td bgcolor="#f2f2f2">[CarMake]</td>
        <td colspan="2">
            <table width="100%" border="0">
                <tr>
                    <td width="20%">Model:</td>
                    <td width="30%" bgcolor="#f2f2f2" style="height: 25px;">[Model]</td>
                    <td width="20%">Year:</td>
                    <td width="30%" bgcolor="#f2f2f2">[Year]</td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td style="padding: 5px;">VIN:</td>
        <td bgcolor="#f2f2f2">[VIN]</td>
        <td style="padding: 5px;">License Plate:</td>
        <td bgcolor="#f2f2f2">[LicensePlate]</td>
    </tr>

    <!-- 投诉与维修请求 -->
    <tr>
        <td style="padding: 5px; vertical-align: top;">
            <br>Complaint:<br><br><br><br><br>
            Repair<br>Request:
        </td>
        <td colspan="3" bgcolor="#f2f2f2" style="height: 300px;">
            Complaint: [Complaint]<br><br>
            Repair Request: [RepairRequest]
        </td>
    </tr>
</table>
